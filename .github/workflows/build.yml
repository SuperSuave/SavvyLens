name: Build Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    name: Read version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from config.h
        id: get_version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(awk '/^#define[[:space:]]+VERSION[[:space:]]+/ {print $3}' config.h)
          VERSION="${VERSION%\"}"
          VERSION="${VERSION#\"}"

          if [ -z "$VERSION" ]; then
            echo "Could not find VERSION in config.h" >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  buildlinux:
    name: Linux x64
    runs-on: ubuntu-22.04
    needs: version

    steps:
      - uses: actions/checkout@v4

      - name: Prepare environment
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-xinerama0 \
            libxcb-randr0 \
            libxkbcommon-x11-0 \
            libfuse2

      - name: Install Qt
        uses: jurplel/install-qt-action@v3

      - name: Compile
        shell: bash
        run: |
          set -euo pipefail
          qmake CONFIG+=release PREFIX=/usr SavvyLens.pro
          make -j"$(nproc)"

      - name: Package AppImage
        shell: bash
        run: |
          set -euo pipefail
          make INSTALL_ROOT=appdir install

          wget -c -nv \
            "https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage"

          chmod +x linuxdeployqt-continuous-x86_64.AppImage

          ./linuxdeployqt-continuous-x86_64.AppImage \
            appdir/usr/share/applications/SavvyLens.desktop \
            -appimage \
            -extra-plugins=iconengines,platformthemes/libqgtk3.so,canbus

          mv SavvyLens-*x86_64.AppImage \
            SavvyLens-${{ needs.version.outputs.version }}-Linux_x64.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: SavvyLens-${{ needs.version.outputs.version }}-Linux_x64
          path: SavvyLens-${{ needs.version.outputs.version }}-Linux_x64.AppImage

  buildmacos86:
    name: macOS x64
    runs-on: macos-15-intel
    needs: version

    steps:
      - uses: actions/checkout@v4

      - name: Prepare macOS environment
        shell: bash
        run: |
          set -euo pipefail
          brew install qt@5
          brew link qt@5 --force

      - name: Compile
        shell: bash
        run: |
          set -euo pipefail
          qmake CONFIG+=release CONFIG+=sdk_no_version_check SavvyLens.pro
          make -j"$(sysctl -n hw.ncpu)"
          lrelease translations/*.ts

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p SavvyLens.app/Contents/MacOS/translations
          mkdir -p SavvyLens.app/Contents/MacOS/help

          cp translations/*.qm SavvyLens.app/Contents/MacOS/translations/
          cp -R help/. SavvyLens.app/Contents/MacOS/help/

          macdeployqt SavvyLens.app -dmg
          mv SavvyLens.dmg \
            SavvyLens-${{ needs.version.outputs.version }}-macOS_x64.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: SavvyLens-${{ needs.version.outputs.version }}-macOS_x64
          path: SavvyLens-${{ needs.version.outputs.version }}-macOS_x64.dmg

  buildmacos-arm64:
    name: macOS ARM64
    runs-on: macos-15
    needs: version

    steps:
      - uses: actions/checkout@v4

      - name: Prepare macOS environment
        shell: bash
        run: |
          set -euo pipefail
          brew install qt@5
          brew link qt@5 --force

      - name: Compile
        shell: bash
        run: |
          set -euo pipefail
          qmake CONFIG+=release CONFIG+=sdk_no_version_check SavvyLens.pro
          make -j"$(sysctl -n hw.ncpu)"
          lrelease translations/*.ts

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p SavvyLens.app/Contents/MacOS/translations
          mkdir -p SavvyLens.app/Contents/MacOS/help

          cp translations/*.qm SavvyLens.app/Contents/MacOS/translations/
          cp -R help/. SavvyLens.app/Contents/MacOS/help/

          macdeployqt SavvyLens.app -dmg
          mv SavvyLens.dmg \
            SavvyLens-${{ needs.version.outputs.version }}-macOS_ARM64.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: SavvyLens-${{ needs.version.outputs.version }}-macOS_ARM64
          path: SavvyLens-${{ needs.version.outputs.version }}-macOS_ARM64.dmg

  buildwindows:
    name: Windows x64
    runs-on: windows-2022
    needs: version

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v3

      - name: Compile
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          qmake CONFIG+=release SavvyLens.pro
          nmake /C

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item "release/SavvyLens.exe" "package/"
          Copy-Item "translations" "package/translations" -Recurse
          Copy-Item "help" "package/help" -Recurse
          Copy-Item "examples" "package/examples" -Recurse

          & "${Env:Qt5_Dir}\bin\windeployqt.exe" `
            --release `
            --dir package `
            "package/SavvyLens.exe"

      - name: Zip package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Compress-Archive `
            -Path package/* `
            -DestinationPath SavvyLens-${{ needs.version.outputs.version }}-Windows_x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: SavvyLens-${{ needs.version.outputs.version }}-Windows_x64
          path: SavvyLens-${{ needs.version.outputs.version }}-Windows_x64.zip

  draft-release:
    name: Draft release
    runs-on: ubuntu-latest
    needs: [version, buildwindows, buildmacos86, buildmacos-arm64, buildlinux]

    steps:
      - uses: actions/download-artifact@v4

      - name: Show downloaded files
        shell: bash
        run: find . -maxdepth 3 -type f | sort

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: SavvyLens v${{ needs.version.outputs.version }}
          draft: true
          prerelease: false
          generate_release_notes: true
          files: |
            SavvyLens-${{ needs.version.outputs.version }}-Linux_x64/SavvyLens-${{ needs.version.outputs.version }}-Linux_x64.AppImage
            SavvyLens-${{ needs.version.outputs.version }}-Windows_x64/SavvyLens-${{ needs.version.outputs.version }}-Windows_x64.zip
            SavvyLens-${{ needs.version.outputs.version }}-macOS_x64/SavvyLens-${{ needs.version.outputs.version }}-macOS_x64.dmg
            SavvyLens-${{ needs.version.outputs.version }}-macOS_ARM64/SavvyLens-${{ needs.version.outputs.version }}-macOS_ARM64.dmg
