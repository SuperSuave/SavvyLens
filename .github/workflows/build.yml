  build-macos-arm64:
    name: macOS ARM64
    runs-on: macos-15
    needs: version

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 5
        uses: jurplel/install-qt-action@v4
        with:
          version: "5.15.2"
          cache: true

      - name: Compile
        shell: bash
        run: |
          set -euo pipefail

          qmake CONFIG+=release CONFIG+=sdk_no_version_check SavvyLens.pro
          make -j"$(sysctl -n hw.ncpu)"
          lrelease translations/*.ts

      - name: Package DMG
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail

          mkdir -p SavvyLens.app/Contents/MacOS/translations
          mkdir -p SavvyLens.app/Contents/MacOS/help
          mkdir -p SavvyLens.app/Contents/MacOS/templates

          cp translations/*.qm \
            SavvyLens.app/Contents/MacOS/translations/

          cp -R help/. \
            SavvyLens.app/Contents/MacOS/help/

          cp -R src/scripting/templates/. \
            SavvyLens.app/Contents/MacOS/templates/

          macdeployqt SavvyLens.app -dmg

          mv SavvyLens.dmg \
            "SavvyLens-${VERSION}-macOS_ARM64.dmg"

      - name: Upload macOS ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: SavvyLens-${{ needs.version.outputs.version }}-macOS_ARM64
          path: SavvyLens-${{ needs.version.outputs.version }}-macOS_ARM64.dmg
          if-no-files-found: error

  build-windows:
    name: Windows x64
    runs-on: windows-2022
    needs: version

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 5
        uses: jurplel/install-qt-action@v4
        with:
          version: "5.15.2"
          cache: true

      - name: Compile
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          qmake CONFIG+=release SavvyLens.pro
          nmake /C

      - name: Bundle application with Qt runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force -Path package | Out-Null

          Copy-Item "release\SavvyLens.exe" "package\"
          Copy-Item "translations" "package\translations" -Recurse
          Copy-Item "help" "package\help" -Recurse
          Copy-Item "examples" "package\examples" -Recurse
          Copy-Item "src\scripting\templates" "package\templates" -Recurse

          $qtRoot = Split-Path -Parent (Split-Path -Parent $Env:Qt5_Dir)
          $windeployqt = Join-Path $qtRoot "bin\windeployqt.exe"

          if (-not (Test-Path $windeployqt)) {
            throw "windeployqt.exe was not found at: $windeployqt"
          }

          & $windeployqt `
            --release `
            --no-translations `
            --dir package `
            "package\SavvyLens.exe"

      - name: Build Inno Setup installer
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"

          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"

          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler was not found at: $iscc"
          }

          & $iscc `
            "/DMyAppVersion=$Env:VERSION" `
            "src\packaging\windows\SavvyLens.iss"

          Move-Item `
            "Output\SavvyLens_Setup.exe" `
            "SavvyLens-$Env:VERSION-Windows_x64.exe"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: SavvyLens-${{ needs.version.outputs.version }}-Windows_x64
          path: SavvyLens-${{ needs.version.outputs.version }}-Windows_x64.exe
          if-no-files-found: error

  draft-release:
    name: Draft GitHub release
    runs-on: ubuntu-latest

    needs:
      - version
      - build-linux
      # - build-macos-x64
      - build-macos-arm64
      - build-windows

    steps:
      - uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Show release files
        shell: bash
        run: |
          set -euo pipefail
          find . -maxdepth 2 -type f | sort

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.version }}
          name: ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          draft: true
          prerelease: false
          generate_release_notes: true
          files: |
            SavvyLens-${{ needs.version.outputs.version }}-Linux_x64.AppImage
            SavvyLens-${{ needs.version.outputs.version }}-Windows_x64.exe
            SavvyLens-${{ needs.version.outputs.version }}-macOS_ARM64.dmg
          
# SavvyLens-${{ needs.version.outputs.version }}-macOS_x64.dmg