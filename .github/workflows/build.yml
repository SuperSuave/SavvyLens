name: Build Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    name: Read version
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from config.h
        id: get_version
        shell: bash
        run: |
          set -euo pipefail

          VERSION=$(awk '/^#define[[:space:]]+VERSION[[:space:]]+/ {print $3}' config.h)
          VERSION="${VERSION%\"}"
          VERSION="${VERSION#\"}"

          if [ -z "$VERSION" ]; then
            echo "Could not find VERSION in config.h" >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building SavvyLens $VERSION"

  build-linux:
    name: Linux x64
    runs-on: ubuntu-22.04
    needs: version

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            libfuse2 \
            libgl1-mesa-dev \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-xinerama0 \
            libxkbcommon-x11-0

      - name: Install Qt 5
        uses: jurplel/install-qt-action@v4
        with:
          version: "5.15.2"
          cache: true

      - name: Compile
        shell: bash
        run: |
          set -euo pipefail

          qmake CONFIG+=release PREFIX=/usr SavvyLens.pro
          make -j"$(nproc)"

      - name: Package AppImage
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail

          make INSTALL_ROOT=appdir install

          wget -q \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage

          wget -q \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage

          chmod +x linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-plugin-qt-x86_64.AppImage

          export QMAKE="$(command -v qmake)"
          export VERSION

          ./linuxdeploy-x86_64.AppImage \
            --appdir appdir \
            --desktop-file appdir/usr/share/applications/SavvyLens.desktop \
            --plugin qt \
            --output appimage

          mv SavvyLens-*.AppImage \
            "SavvyLens-${VERSION}-Linux_x64.AppImage"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: SavvyLens-${{ needs.version.outputs.version }}-Linux_x64
          path: SavvyLens-${{ needs.version.outputs.version }}-Linux_x64.AppImage
          if-no-files-found: error

